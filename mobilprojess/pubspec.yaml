name: mobilproje
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  fl_chart: ^0.66.0
  usage_stats: ^1.1.0
  intl: ^0.19.0
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.0.10
  supabase_flutter: ^2.6.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.1
  mobile_scanner: ^7.2.0
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  firebase_core: ^3.0.0
  flutter_contacts: ^2.0.2
  timezone: ^0.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Asset Tanımlamaları
  assets:
    - assets/icons/google.svg
    - assets/icons/apple.svg
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/images/app_logo.png"